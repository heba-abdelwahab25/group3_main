{% extends "base.html" %}
{% block content %}
<div class="form-container">
  <h2>🔐 Login</h2>
  <form method="post">
    {{ form.hidden_tag() }}
    <div class="form-group">
      <label for="username">Username</label>
      {{ form.username(class="form-input") }}
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      {{ form.password(class="form-input") }}
    </div>
    <button type="submit">Login</button>
    <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary); font-size: 0.875rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
    </p>
  </form>
</div>
{% endblock %}
