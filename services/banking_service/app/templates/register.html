{% extends "base.html" %}
{% block title %}Register — SecureBank PQC{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Create Account</h4>
        <form method="post">
          <div class="mb-3"><label class="form-label">Username</label>
            <input name="username" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required></div>
          <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-2 text-center"><a href="{{ url_for('auth.login') }}">Already have an account?</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
